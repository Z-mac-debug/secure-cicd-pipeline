version: 2
updates:
  # Keeps the SHA-pinned actions current; Dependabot updates the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # don't adopt brand-new releases straight away
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # don't adopt brand-new releases straight away

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # don't adopt brand-new releases straight away

  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # don't adopt brand-new releases straight away
